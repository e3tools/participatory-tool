name: Build and Publish Image to Docker Hub

# on:
#   push:
#     branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]
on:
  [workflow_dispatch]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build . --file Dockerfile --tag stevenyaga/frappe-backend:latest
    - name: Push image to Docker Hub
      run: |
        docker login -u stevenyaga -p ${{ secrets.DOCKER_HUB_TOKEN }}
        docker push stevenyaga/frappe-backend:latest
